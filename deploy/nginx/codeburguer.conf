# Vhost do Code Burguer's no nginx do host (/etc/nginx/sites-available/codeburguer.conf).
#
# O site é público: o app do Cloudflare Access deste domínio usa uma política Bypass para
# todos, então o Access não pede login nem envia o cabeçalho Cf-Access-Jwt-Assertion.
# Mesmo assim, este vhost:
#   1. só aceita conexões vindas dos IPs do Cloudflare (snippet gerado por
#      deploy/gerar-cloudflare-only.sh), e
#   2. recusa /tabela, que lista todos os clientes com o hash da senha sem pedir login e
#      não é usado por nenhuma página. O padrão cobre /tabela;x e /tabela/, que o Tomcat
#      também entrega ao servlet.
#
# TLS de origem: certificado autoassinado, aceito pelo modo "Full" da zona maia-ai.com.br.
# Se a zona passar para "Full (strict)", trocar por certificado do Let's Encrypt.

server {
    listen 80;
    server_name codeburguer.maia-ai.com.br;
    access_log off;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name codeburguer.maia-ai.com.br;

    ssl_certificate     /etc/nginx/codeburguer-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/codeburguer-tls/privkey.pem;

    access_log /var/log/nginx/codeburguer.access.log;
    error_log  /var/log/nginx/codeburguer.error.log;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ~* "^/+tabela([;/]|$)" {
        return 403;
    }

    location / {
        include /etc/nginx/snippets/codeburguer-cloudflare-only.conf;

        proxy_pass http://127.0.0.1:8895;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }
}
